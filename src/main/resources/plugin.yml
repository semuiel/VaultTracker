name: VaultTracker
version: 0.10.5
softdepend: [flexity]
main: ru.vaulttracker.VaultTrackerPlugin
api-version: '1.21.11'
folia-supported: true
description: Chest resource catalogue with durable MariaDB synchronization
commands:
  find:
    description: Find resources in your registered chests
    usage: /find <resource> [page]
  topitem:
    description: Find players with a resource
    usage: /topitem diamond
    aliases: [itemtop]
  vaulttracker:
    description: Chest catalogue commands
    aliases: [vtrack]
permissions:
  vaulttracker.link:
    default: true
    description: Link own Minecraft character to Telegram using a one-time code
  vaulttracker.register:
    default: true
    description: Register a chest by placing a vault sign
  vaulttracker.search:
    default: true
    description: Search published resource totals
  vaulttracker.admin:
    default: op
    description: View storage status and request reconciliation
