# Подключение плагина к платёжному сервису. Применение: /vtrack reload.
# Сам сервис настраивается в donation-service/config.local.json.
# Бонус за отзыв задаётся там; видимость донатов — в меню Root.

# Включить связь с платёжным сервисом.
enabled: false

# Ссылка на ваш лот FunPay.
offer-url: ""

# Локальный порт сервиса на 127.0.0.1; должен совпадать с его конфигом.
port: 18763

# Секретный ключ связи, тот же api_key в config.local.json. Не публикуйте.
# Ключ FunPay golden_key здесь не хранится.
api-key: ""
