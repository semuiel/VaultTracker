# Охрана зарегистрированных хранилищ. Применить: /vtrack reload.
# Привязки и настройки кнопок хранятся отдельно в guard-data.mv.db.
enabled: true

# Время отсутствия для уведомлений администраторам и владельцам,
# которые не выбрали личное время в кабинете бота → Настройки.
# 120 секунд = 2 минуты. 0 — сразу после выхода.
offline-seconds: 120

# Telegram ID единственного суперадминистратора. 0 — раздел выключен.
# Указывается вручную владельцем сервера; обычный администратор изменить его не может.
superAdminUserId: 0

# История хранится 30 дней. Уведомления отправляются в личку владельцу
# и adminUserIds из telegram.yml с учётом личных переключателей.
# Каждый получатель должен сначала открыть бота и нажать /start.
# Охрана учитывает изменения количества предметов и снятие хранилища
# с учёта. Сама охрана не запрещает доступ к хранилищам.
# Незагруженные чанки не сканируются: изменения видны при следующей сверке.
