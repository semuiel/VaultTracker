# Охрана хранилищ и основной Root. Применение: /vtrack reload.
# Привязки, друзья и личные настройки находятся в guard-data.mv.db.
# Охрана сообщает об изменениях, но не запрещает открывать сундуки.

# Включить охрану зарегистрированных хранилищ.
enabled: true

# Время отсутствия по умолчанию для уведомлений, в секундах.
# Личная настройка в боте имеет приоритет. 0 — после выхода; 172800 — 2 дня.
offline-seconds: 120

# Telegram ID основного Root — владельца управления ботом.
# Только он управляет списком дополнительных Root. Его нельзя удалить через бота.
# 0 — основной Root не задан. Это ID пользователя, а не группы.
superAdminUserId: 0
