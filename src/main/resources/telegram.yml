# Торговый Telegram-бот: подключение, доступ и сеть.
# Применение: /vtrack reload. Тексты и эмодзи — в telegram-menu.yml.
# true — включено, false — выключено. Отступы делайте пробелами.
# Токен и пароль прокси не публикуйте.

# Запустить торгового бота.
enabled: false

# Токен бота из BotFather.
token: "ВСТАВЬТЕ_ТОКЕН_ОТ_BOTFATHER"

# Разрешённые группы и темы для команд. Личное меню доступно отдельно.
# chatId — ID группы; topicId — ID темы, 0 для чата без тем.
# isDefault — отметка основной темы. Узнать ID: /id в нужной теме, ответ в консоли.
chats:
  - isDefault: true
    chatId: -1001234567890
    topicId: 12345

# Запасной список групп: используется, только если chats пуст. Разрешает все их темы.
allowedChatIds: []

# Telegram ID администраторов бота. Основной Root задаётся в guard.yml.
adminUserIds:
  - 123456789

# Старый параметр: в текущей версии размер страниц фиксирован — 20 строк.
pageSize: 20

# Удаление ответов в группах через 30–86400 секунд. Личное меню не удаляется.
messageLifetimeSeconds: 300

# Ожидание обновлений Telegram: 5–50 секунд. Обычно менять не нужно.
pollTimeoutSeconds: 30

# Дополнительные настройки подключения.
advanced:
  # Адрес Telegram Bot API.
  botApiUrl: "https://api.telegram.org"
  # Прокси: none — напрямую, socks5 — SOCKS5, http — HTTP CONNECT.
  # Непустой telegram-proxies.txt имеет приоритет; строка: host:port:username:password.
  proxy:
    # Тип подключения.
    type: "none"
    # Адрес прокси.
    host: ""
    # Порт прокси.
    port: 1080
    # Логин прокси; пусто, если авторизация не нужна.
    username: ""
    # Пароль прокси; пусто, если авторизация не нужна.
    password: ""
  # Повтор подключения при сбое сети.
  connectionRetry:
    # Старый параметр: текущая версия повторяет подключение без ограничения попыток.
    maxAttempts: 0
    # Начальная задержка повторного подключения, в миллисекундах.
    initialDelay: 1000
    # Максимальная задержка повторного подключения, в миллисекундах.
    maxDelay: 300000

# Версия формата. Не менять вручную.
version: 4
