# ================================================================
# Telegram-бот VaultTracker
# Файл находится в plugins/VaultTracker/telegram.yml.
# После изменений выполните в игре /vtrack reload.
# ================================================================

# true — запустить бота; false — оставить выключенным.
enabled: false

# Токен, полученный у @BotFather. Никому его не показывайте.
token: "ВСТАВЬТЕ_НОВЫЙ_ТОКЕН_BOTFATHER"

# --- Где разрешено пользоваться ботом ---

# Рекомендуемый вариант для групп с темами.
# Выполните /id в нужной теме: бот покажет chatId и topicId.
# Если chats заполнен, бот работает только в перечисленных чатах и темах.
# topicId: 0 означает обычный чат без тем.
# isDefault отмечает одну основную тему для будущих уведомлений.
chats: []
# Пример одной разрешённой темы — удалите "chats: []" выше и раскомментируйте:
# chats:
#   - isDefault: true
#     chatId: -1000000000000
#     topicId: 12345
#   - isDefault: false
#     chatId: -1000000000001
#     topicId: 67890

# Упрощённый старый вариант: разрешает все темы указанных чатов.
# Если chats заполнен, этот список не используется.
# Если оба списка пусты, бот доступен в любом чате, куда он добавлен.
allowedChatIds: []

# --- Администраторы бота ---

# Telegram ID пользователей с доступом к /items и /status.
# Каждый администратор должен выполнить /id и взять строку "ID пользователя".
# Это именно ID пользователя, а не chatId группы.
adminUserIds: []
# Пример:
# adminUserIds:
#   - 123456789
#   - 987654321

# --- Вид и срок жизни ответов ---

# Количество строк на одной странице. Допустимо от 4 до 15.
pageSize: 8

# Через сколько секунд удалять ответы бота. 300 секунд = 5 минут.
# Допустимо от 30 секунд до 86400 секунд (24 часа).
messageLifetimeSeconds: 300

# Длительность одного ожидания новых сообщений от Telegram.
# Это не частота сканирования Minecraft и не создаёт нагрузку на хранилища.
# Обычно менять не нужно. Допустимо от 5 до 50 секунд.
pollTimeoutSeconds: 30

# --- Подключение к Telegram ---

advanced:
  # Адрес Telegram Bot API. Обычно менять не нужно.
  botApiUrl: "https://api.telegram.org"

  proxy:
    # Тип подключения:
    # none   — без прокси;
    # socks5 — SOCKS5-прокси;
    # http   — HTTP/HTTPS CONNECT-прокси.
    type: "none"

    # Адрес и порт прокси. При type: "none" оставьте пустой адрес.
    host: ""
    port: 1080

    # Логин и пароль прокси. Если авторизация не нужна, оставьте оба пустыми.
    username: ""
    password: ""

  connectionRetry:
    # Сколько раз пытаться восстановить подключение.
    # Значение 0 или меньше означает бесконечное число попыток.
    maxAttempts: 10

    # Задержка перед первой повторной попыткой, в миллисекундах.
    initialDelay: 1000

    # Максимальная задержка между попытками, в миллисекундах.
    maxDelay: 300000

# Версия формата конфигурации. Не меняйте вручную.
version: 4
