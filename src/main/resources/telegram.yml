# Telegram-бот запускается внутри VaultTracker.
enabled: false
token: "ВСТАВЬТЕ_НОВЫЙ_ТОКЕН_BOTFATHER"

# Пустой список разрешает доступ всем. Для закрытого каталога укажите ID после команды /id.
allowedChatIds: []

# Telegram ID пользователей, которым доступны /items и /status.
# Свой ID можно узнать командой /id.
adminUserIds: []

# Если список chats заполнен, бот работает только в указанных чатах и темах.
# topicId: 0 означает чат без тем. isDefault резервирует основную тему для уведомлений.
chats: []
# chats:
#   - isDefault: true
#     chatId: -1000000000000
#     topicId: 12345

pageSize: 8
pollTimeoutSeconds: 30

# Ответы бота удаляются через 5 минут.
messageLifetimeSeconds: 300

advanced:
  botApiUrl: "https://api.telegram.org"
  proxy:
    # Поддерживаются: none, socks5, http
    type: "none"
    host: ""
    port: 1080
    username: ""
    password: ""
  connectionRetry:
    # Значение меньше 1 означает бесконечное число попыток.
    maxAttempts: 10
    initialDelay: 1000
    maxDelay: 300000

# Версия формата. Не меняйте вручную.
version: 3
