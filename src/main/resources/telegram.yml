# ================================================================
# Telegram-бот VaultTracker
# Файл создаётся в plugins/VaultTracker/telegram.yml.
# После изменения настроек выполните в игре /vtrack reload.
# ================================================================

# true  — запустить Telegram-бота;
# false — оставить Telegram-бота выключенным.
enabled: false

# Токен, который выдаёт @BotFather после команды /newbot.
# Никому не показывайте настоящий токен и не добавляйте его в Git.
token: "ВСТАВЬТЕ_ТОКЕН_ОТ_BOTFATHER"

# Список разрешённых Telegram-групп и тем.
# Выполните /id прямо в нужной теме: бот покажет chatId и topicId.
# Если chats заполнен, команды принимаются только в этих парах.
# В запрещённой теме бот молча игнорирует команды и удаляет их.
# Для удаления сообщений боту нужно право администратора группы "Удаление сообщений".
# topicId: 0 — обычный чат без тем.
# isDefault: true — основная тема для будущих автоматических уведомлений.
chats:
  - isDefault: true
    chatId: -1001234567890
    topicId: 12345

# Запасной упрощённый режим: разрешить все темы перечисленных чатов.
# Используется только когда chats: [] оставлен пустым.
allowedChatIds: []

# Telegram ID пользователей с доступом к административным командам /items и /status.
# Узнать свой ID можно командой /id, строка "ID пользователя".
# Это ID пользователя, а не ID группы.
adminUserIds:
  - 123456789

# Сколько строк показывать на одной странице интерактивного ответа.
# Допустимый диапазон: от 4 до 15.
pageSize: 8

# Через сколько секунд удалять сообщения бота.
# 300 секунд = 5 минут. Допустимый диапазон: от 30 до 86400 секунд.
messageLifetimeSeconds: 300

# Сколько секунд ждать новые сообщения Telegram за один запрос.
# Это не сканирование Minecraft и не создаёт нагрузку на хранилища.
# Допустимый диапазон: от 5 до 50 секунд.
pollTimeoutSeconds: 30

advanced:
  # Обычный адрес Telegram Bot API. Обычно менять не нужно.
  botApiUrl: "https://api.telegram.org"

  proxy:
    # Тип подключения к Telegram:
    # none   — подключение напрямую, без прокси;
    # socks5 — SOCKS5-прокси;
    # http   — HTTP/HTTPS CONNECT-прокси.
    type: "none"

    # Адрес и порт прокси. При type: "none" адрес оставьте пустым.
    host: ""
    port: 1080

    # Данные авторизации прокси.
    # Если прокси не требует авторизацию, оставьте оба поля пустыми.
    username: ""
    password: ""

  connectionRetry:
    # Максимальное количество попыток подключиться заново.
    # 0 или отрицательное значение означает бесконечные попытки.
    maxAttempts: 10

    # Задержка перед первой повторной попыткой, миллисекунды.
    initialDelay: 1000

    # Максимальная задержка между повторными попытками, миллисекунды.
    maxDelay: 300000

# Версия формата конфигурации. Не меняйте вручную.
version: 4
