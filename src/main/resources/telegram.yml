# Торговый Telegram-бот: подключение, доступ и сеть.
# Применение: /vtrack reload. Тексты и эмодзи — в telegram-menu.yml.
# true — включено, false — выключено. Отступы делайте пробелами.
# Токен и пароль прокси не публикуйте.

# Запустить торгового бота.
enabled: false

# Токен бота из BotFather.
token: "ВСТАВЬТЕ_ТОКЕН_ОТ_BOTFATHER"

# Разрешённые группы и темы для команд. Личное меню доступно отдельно.
# chatId — ID группы; topicId — ID темы, 0 для чата без тем.
# isDefault — отметка основной темы. Узнать ID: /id в нужной теме, ответ в консоли.
chats:
  - isDefault: true
    chatId: -1001234567890
    topicId: 12345

# Новые сообщения из этой темы объявляются всем игрокам в игровом чате.
# Telegram-опрос получает текст «важное голосование», остальные посты — «важная новость».
# Значения 0 отключают объявления. Бот должен состоять в группе и видеть сообщения темы.
moderation:
  # Тема флудилки для предупреждений /offtop. Оба 0 — без ссылки.
  # Ограничение действует только в исходной теме и хранится между перезапусками.
  # Команды доступны администраторам Telegram; боту нужно право удаления сообщений.
  offtopicChatId: 0
  floodTopicId: 0

news:
  chatId: -1002669159447
  topicId: 206056

# Запасной список групп: используется, только если chats пуст. Разрешает все их темы.
allowedChatIds: []

# Telegram ID администраторов бота. Основной Root задаётся в guard.yml.
adminUserIds:
  - 123456789

# Старый параметр: в текущей версии размер страниц фиксирован — 20 строк.
pageSize: 20

# Удаление ответов в группах через 30–86400 секунд. Личное меню не удаляется.
messageLifetimeSeconds: 300

# Ожидание обновлений Telegram: 5–50 секунд. Обычно менять не нужно.
pollTimeoutSeconds: 30

# Долгосрочная Telegram-статистика. Только Root, отдельный allowlist чатов.
telegramAnalytics:
  # Сбор метаданных начинается после включения. История Telegram задним числом недоступна.
  enabled: false
  # Явный список ID групп/каналов. Пустой список ничего не собирает.
  # Пример: [-1002669159447, -1002748891862]. Включайте только нужные вам сообщества.
  trackedChats: []
  # Часовой пояс календарных дней/графиков. Пустую строку не оставлять.
  # Если ключ отсутствует, используется часовой пояс сервера. После начала сбора менять нельзя.
  timezone: "Asia/Novosibirsk"
  # Root также должен быть реальным administrator/creator этой группы.
  accessChatId: 0
  # Новый путь на существующем HTTPS proxy; тот же listener, что у CoreProtect.
  publicUrl: ""
  # Число участников снимается раз в 15–1440 минут, без сообщений в чат.
  memberSnapshotMinutes: 60
  # Данные хранятся бессрочно в telegram-analytics.mv.db. Настройки очистки нет.

# Панель расследований CoreProtect. Выключена по умолчанию; production сама не включается.
# Поддержан read-only MariaDB backend CoreProtect 24.1 / API 12.
coreprotectWeb:
  enabled: false
  # Группа, в которой пользователь должен СЕЙЧАС быть администратором/владельцем.
  # Дополнительно обязательна роль Admin, SuperAdmin или Root в VaultTracker.
  accessChatId: 0
  # Полный публичный HTTPS URL панели, например https://admin.example.org/coreprotect/.
  # Пустая строка скрывает Telegram-кнопку; локальный listener может работать отдельно.
  publicUrl: ""
  # Только localhost. Публичный HTTPS настраивается отдельно через reverse proxy.
  bindHost: "127.0.0.1"
  bindPort: 8194
  database:
    host: "127.0.0.1"
    port: 3306
    name: "coreprotect"
    prefix: "co_"
    # Отдельный пользователь с единственным GRANT SELECT ON coreprotect.*.
    # Учётная запись основного CoreProtect НЕ подходит; лишние grants/роли отклоняются.
    user: ""
    # Можно задать переменной окружения VAULT_COREPROTECT_VIEWER_PASSWORD.
    password: ""
  limits:
    pageSize: 50
    maxPageSize: 100
    # Глубина страниц: при достижении предела сузьте период или фильтры.
    maxOffset: 2000
    maxDays: 30
    # Радиус куба XYZ. 0 — точные координаты одного блока, не двойного сундука целиком.
    maxRadius: 32
    concurrency: 2
    timeoutSeconds: 5
    requestsPerMinute: 20

# Дополнительные настройки подключения.
advanced:
  # Адрес Telegram Bot API.
  botApiUrl: "https://api.telegram.org"
  # Прокси: none — напрямую, socks5 — SOCKS5, http — HTTP CONNECT.
  # Непустой telegram-proxies.txt имеет приоритет; строка: host:port:username:password.
  proxy:
    # Тип подключения.
    type: "none"
    # Адрес прокси.
    host: ""
    # Порт прокси.
    port: 1080
    # Логин прокси; пусто, если авторизация не нужна.
    username: ""
    # Пароль прокси; пусто, если авторизация не нужна.
    password: ""
  # Повтор подключения при сбое сети.
  connectionRetry:
    # Старый параметр: текущая версия повторяет подключение без ограничения попыток.
    maxAttempts: 0
    # Начальная задержка повторного подключения, в миллисекундах.
    initialDelay: 1000
    # Максимальная задержка повторного подключения, в миллисекундах.
    maxDelay: 300000

# Версия формата. Не менять вручную.
version: 4
# Аналитика использования бота: отдельна от статистики сообщений чатов.
# Включайте при плановом обновлении. Используется тот же localhost-порт coreprotectWeb.
botAnalytics:
  enabled: false
  # Административный чат. Доступ: одновременно Root и администратор этого чата.
  # Если 0, при загрузке берётся coreprotectWeb.accessChatId.
  accessChatId: 0
  # Отдельный HTTPS-маршрут reverse proxy, например https://ваш-домен/bot-analytics/
  publicUrl: ""
  # Фиксируется при первом включении; после сбора не менять без отдельного переноса.
  timezone: "Asia/Novosibirsk"
