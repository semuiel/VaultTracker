# VaultTracker — хранилища и база ресурсов.
# Настройки Telegram находятся в отдельных telegram*.yml.
# Для изменения подключения к базе нужен перезапуск плагина.

# Имя этого сервера. Не меняйте после начала работы: оно связано с базой и cache-файлом.
server-id: test

# Внешняя MariaDB. Локальный cache остаётся отдельным файлом.
database:
  # Использовать внешнюю базу ресурсов.
  enabled: false
  # Адрес сервера MariaDB.
  host: 127.0.0.1
  # Порт MariaDB.
  port: 3306
  # Название базы.
  name: vault_tracker
  # Пользователь базы.
  username: vault_plugin
  # Пароль. Можно задать через VAULT_DB_PASSWORD вместо файла.
  password: ''

# Задержка обновления после изменения сундука: 1–20 тиков; 20 тиков ≈ 1 секунда.
update-delay-ticks: 2

# Старый лимит. Текущая версия не ограничивает число хранилищ этим параметром.
max-vaults-per-player: 0
