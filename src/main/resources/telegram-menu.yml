# Настройка всех текстов и значков торгового Telegram-бота.
# После изменения выполните /vtrack reload.
#
# КАСТОМНЫЕ ЭМОДЗИ: найдите нужный обычный значок и вставьте только числовой ID в customEmojiId.
# emoji — запасной обычный смайлик. Если Telegram не примет customEmojiId, бот покажет его.
# original не меняйте: по нему плагин находит значок в существующем меню.
# В inline-кнопках Telegram всегда используется emoji; кастомные эмодзи отображаются в тексте и заголовках.
emojis:
  # ЛИЧНЫЙ КАБИНЕТ — ПОЛНОЕ СЕРДЦЕ ЗДОРОВЬЯ: вставьте ID полного сердца ниже.
  - original: "♥"
    emoji: "❤️"
    customEmojiId: ''
  # ЛИЧНЫЙ КАБИНЕТ — ПОЛОВИНА СЕРДЦА: вставьте ID половины сердца ниже.
  - original: "♡"
    emoji: "💔"
    customEmojiId: ''
  # ЛИЧНЫЙ КАБИНЕТ — ПУСТОЕ СЕРДЦЕ: вставьте ID пустого сердца ниже.
  - original: "♤"
    emoji: "⚰️"
    customEmojiId: ''
  # ЛИЧНЫЙ КАБИНЕТ — ПОЛНЫЙ ЗНАЧОК ГОЛОДА.
  - original: "◆"
    emoji: "🍖"
    customEmojiId: ''
  # ЛИЧНЫЙ КАБИНЕТ — ПОЛОВИНА ЗНАЧКА ГОЛОДА.
  - original: "◇"
    emoji: "🍖"
    customEmojiId: ''
  # ЛИЧНЫЙ КАБИНЕТ — ПУСТОЙ ЗНАЧОК ГОЛОДА.
