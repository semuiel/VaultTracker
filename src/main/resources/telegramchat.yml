# Общий чат Minecraft ↔ Telegram, события и темы поддержки.
# Применение: /vtrack reload. Настройки торгового бота — в telegram.yml.
# Для чтения обычных сообщений отключите Privacy Mode в BotFather
# или выдайте боту права администратора группы.
# Прокси берутся из telegram.yml и telegram-proxies.txt.

# Включить мост общего чата.
enabled: false

# Токен чат-бота из BotFather, либо VAULT_TELEGRAM_CHAT_TOKEN.
# Можно использовать токен торгового бота: приём обновлений будет общий.
# Другой процесс не должен получать обновления с тем же токеном.
token: ""

# Группа и тема общего чата.
chat:
  # ID группы, обычно начинается с -100.
  chatId: 0
  # ID темы; 0 — основная тема или чат без тем.
  topicId: 0
  # Пересылать сообщения из игры в Telegram.
  minecraftToTelegram: true
  # Пересылать сообщения из Telegram в игру.
  telegramToMinecraft: true

# Отображение и пересылка сообщений.
messages:
  # Показывать [TG] у привязанных игроков.
  showTelegramTagLinked: true
  # Показывать [TG] у пользователей без привязки.
  showTelegramTagUnlinked: true
  # Использовать игровой ник и оформление FLEXITY для привязанных аккаунтов.
  linkedPlayerIdentity: true
  # Пересылать только игровые сообщения с этим префиксом.
  # \uE000 — префикс глобального чата FLEXITY; пустая строка разрешает все сообщения.
  requirePrefixInMinecraft: "\uE000"
  # Оставлять этот префикс в пересланном тексте.
  keepPrefix: false
  # Объединять сообщения за 0–30 секунд. 0 — отправлять отдельно.
  mergeWindowSeconds: 0
  # true — настоящий ник; false — отображаемое имя из чата.
  useRealUsername: false
  # Показывать в игре подписи и обозначения вложений. Файлы не скачиваются.
  mediaLabels: true
  # Отправлять сообщения чата в Telegram без звука.
  silent: false

# Достижения Minecraft в отдельной группе/теме.
advancements:
  # Включить пересылку достижений.
  enabled: true
  # ID группы достижений.
  chatId: 0
  # ID темы достижений; 0 — без отдельной темы.
  topicId: 0
  # Обычные достижения.
  task: true
  # Достижения типа «цель».
  goal: true
  # Достижения типа «испытание».
  challenge: true
  # Добавлять описание достижения.
  showDescription: false
  # Отправлять достижения без звука.
  silent: false

# Модерация Telegram: /report ответом на сообщение.
# Действия доступны администраторам исходной Telegram-группы.
# Боту нужны права писать в тему, а для блокировок — блокировать пользователей.
reports:
  # Включить репорты Telegram.
  enabled: true
  # Административная группа для репортов и обращений поддержки.
  chatId: -1002748891862
  # Тема репортов Telegram.
  topicId: 34339
  # Число предупреждений до автоматического бана на сутки.
  maxWarnings: 5
  # Включить автоматический бан при достижении лимита предупреждений.
  autoBan: true

# Темы обращений игроков в группе reports.chatId.
# Бот должен иметь доступ к группе и право писать в темы. 0 — тема не настроена.
support:
  # Жалобы на игроков.
  complaintsTopicId: 0
  # Предложения.
  suggestionsTopicId: 0
  # Сообщения об ошибках.
  bugsTopicId: 0
  # Заявки на разбан.
  unbanRequestsTopicId: 0

# Команда /list в темах общего чата и достижений. Игроки в vanish скрыты.
list:
  # Включить список игроков онлайн.
  enabled: true
  # Через сколько секунд удалять сообщение со списком.
  messageLifetimeSeconds: 300
  # Показывать настоящий игровой ник.
  useRealUsername: true
  # Показывать пинг рядом с ником.
  showPing: false
  # Выравнивать колонку пинга в стандартном формате списка.
  alignPing: true
  # Отправлять список без звука.
  silent: false
  # Значки миров. emoji — обычный значок, customEmojiId — ID в кавычках.
  # Пустой ID отключает кастомный значок; если Telegram его отклонит, используется emoji.
  dimensions:
    # Верхний мир.
    overworld:
      emoji: "🌍"
      customEmojiId: ""
    # Нижний мир.
    nether:
      emoji: "🔥"
      customEmojiId: ""
    # Край.
    end:
      emoji: "🌌"
      customEmojiId: ""
    # Другие измерения.
    other:
      emoji: "❓"
      customEmojiId: ""

# События сервера в теме общего чата.
events:
  # Вход игрока.
  join: false
  # Сообщать о входе только для новичков.
  firstJoinOnly: false
  # Выход игрока.
  leave: false
  # Смерть игрока.
  death: false
  # Запуск сервера.
  serverStart: false
  # Остановка сервера.
  serverStop: false
  # Отправлять события без звука.
  silent: true

# Подключение к Telegram. При общем токене опрос выполняет торговый бот.
advanced:
  # Адрес Telegram Bot API.
  botApiUrl: "https://api.telegram.org"
  # Ожидание обновлений: 5–50 секунд.
  pollTimeoutSeconds: 30
  # Бесконечный повтор подключения при сбое сети.
  connectionRetry:
    # Начальная задержка, в миллисекундах.
    initialDelay: 1000
    # Максимальная задержка, в миллисекундах.
    maxDelay: 300000

# Шаблоны сообщений. Имена {параметров} сохраняйте.
# Для Telegram — HTML: <b>жирный</b>, <i>курсив</i>, <code>код</code>.
# Только telegramChat использует MiniMessage для игры.
formats:
  # Из игры в Telegram: {username} — имя, {text} — сообщение.
  minecraftChat: "<b>[{username}]</b> {text}"
  # Из Telegram в игру: {sender} — имя, {text} — сообщение, {tg} — отметка [TG].
  telegramChat: "{tg}<white>{sender}<gray>:</gray> {text}</white>"
  # Заголовок /list: {count} — онлайн, {page}/{pages} — страницы.
  listHeader: "📝 <b>Вот они слева направо:</b> · {count} онлайн · {page}/{pages}"
  # Строка /list: {emoji}, {name}, {username}, {world}, {number}, {ping}.
  listRow: "{emoji} {name}{ping}"
  # Суффикс пинга: {ping} — число миллисекунд.
  listPing: " · {ping} мс"
  # Текст, когда игроков онлайн нет.
  listEmpty: "<b>Идеальное время для захвата мира. Никакой конкуренции.😉</b>"
  # Обычное достижение: {username}, {title}, {description}.
  advancementTask: "😼 <b>{username} получил достижение {title}</b>\n{description}"
  # Цель: {username}, {title}, {description}.
  advancementGoal: "🎯 <b>{username} достиг цели {title}</b>\n{description}"
  # Испытание: {username}, {title}, {description}.
  advancementChallenge: "🏅 <b>{username} завершил испытание {title}</b>\n{description}"
  # Вход: {username}.
  join: "🥳 <b>{username} вошёл в игру</b>"
  # Первый вход: {username}.
  firstJoin: "🥳 <b>{username} впервые вошёл в игру</b>"
  # Выход: {username}.
  leave: "😕 <b>{username} вышел из игры</b>"
  # Смерть: {text}.
  death: "☠️ {text}"
  # Сообщение о запуске.
  serverStart: "✅ <b>Сервер запущен!</b>"
  # Сообщение об остановке.
  serverStop: "❌ <b>Сервер остановлен!</b>"
